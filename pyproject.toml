[project]
name = "opro"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "absl-py==2.0.0",
    "google-generativeai==0.1.0",
    "immutabledict==3.0.0",
    "matplotlib>=3.10.9",
    "numpy>=2.2.6",
    "openai==0.27.2",
    "pandas>=2.3.3",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
